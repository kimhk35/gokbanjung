# Checks every pull request without secrets or a database: tests use the
# bundled PGlite database and the build needs no DATABASE_URL.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      # Existing lint errors predate this workflow; report them without blocking.
      - run: npm run lint
        continue-on-error: true
